name: claude

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Automatický review každého PR + @claude v komentáři = provede požadovanou změnu
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ github.event_name == 'pull_request' && 'Zreviduj tento PR jako senior TypeScript/React reviewer. Hledej chyby (správnost, async, offline cache, Supabase RLS, i18n klíče, regrese v tréninkovém playeru), ne styl. Piš česky, stručně, ke každému nálezu soubor:řádek a návrh opravy. Když nic vážného nenajdeš, řekni to jednou větou.' || '' }}
          claude_args: --max-turns 25
